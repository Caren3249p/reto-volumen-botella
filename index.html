<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto Volumen Botella</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Estilos solo para los elementos nuevos (no tocan tu style.css) */
  .hint { font-size: 0.9rem; opacity: 0.8; margin: 6px 0; }
  .tbl-scroll { overflow-x: auto; }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #canvas, #video, #plotCanvas { max-width: 100%; }
  #plotCanvas { width: 100%; height: auto; margin-top: 12px; }
  details { margin: 8px 0; }
  summary { cursor: pointer; }
  input[type="range"] { width: 100%; }
</style>
</head>
<body>
<div class="container">
  <h1>Cálculo de Volumen Numérico</h1>

  <!-- Control de Altura, Volumen y Cámara -->
  <div class="controls-card">
    <div class="input-group">
      <label for="realHeight">Altura real (cm):</label>
      <input type="number" id="realHeight" value="21" step="0.1">
    </div>
    <div class="input-group">
      <label for="targetVolume">Volumen Objetivo (mL):</label>
      <input type="number" id="targetVolume" value="250" step="10" placeholder="Ej: 250, 500, 1000">
    </div>
    <div class="input-group">
      <label for="sensitivity">Sensibilidad de detección: <span id="sensVal">40</span></label>
      <input type="range" id="sensitivity" min="10" max="120" value="40">
    </div>
    <div class="button-group">
      <button id="btnStartCamera" class="btn primary">Iniciar Cámara</button>
      <button id="btnCapture" class="btn secondary" disabled>Capturar Foto</button>
      <label for="fileInput" class="btn secondary" style="cursor:pointer">Subir / tomar foto</label>
      <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
      <button id="btnReset" class="btn danger">Reiniciar</button>
    </div>
    <p id="status" class="hint"></p>
  </div>

  <!-- Visor y Canvas -->
  <div class="viewer-card">
    <video id="video" autoplay playsinline muted style="display: none;"></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <button id="btnCalculate" class="btn success" disabled>Calcular Volumen</button>
  </div>

  <!-- Resultados del Cálculo -->
  <div id="resultsCard" class="card" style="display: none;">
    <h2>Resultados del Cálculo Numérico</h2>
    <div class="summary-box">
      <p><strong>Volumen Total Estimado:</strong> <span id="volResult">0</span> mL (cm³)</p>
      <p><strong>Nodos Evaluados:</strong> <span id="pointsCount">0</span></p>
      <div id="secanteResult" class="highlight-text"></div>
    </div>

    <div id="methodsOut"></div>
    <canvas id="plotCanvas"></canvas>

    <h3>Dataset Extraído (z_i, r_i)</h3>
    <div class="tbl-scroll">
      <table id="datasetTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Altura z_i (cm)</th>
            <th>Radio r_i (cm)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
