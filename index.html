<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Volumen Botella</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cálculo de Volumen Numérico</h1>

        <!-- Control de Altura y Cámara -->
        <div class="controls-card">
            <label for="realHeight">Altura real (cm):</label>
            <input type="number" id="realHeight" value="21" step="0.1">

            <div class="button-group">
                <button id="btnStartCamera" class="btn primary">Iniciar Cámara</button>
                <button id="btnCapture" class="btn secondary" disabled>Capturar Foto</button>
                <button id="btnReset" class="btn danger">Reiniciar Puntos</button>
            </div>
        </div>

        <!-- Visor y Canvas -->
        <div class="viewer-card">
            <video id="video" autoplay playsinline style="display: none;"></video>
            <canvas id="canvas" style="display: none;"></canvas>
            
            <button id="btnCalculate" class="btn success" disabled>Calcular Volumen</button>
        </div>

        <!-- Resultados del Cálculo -->
        <div id="resultsCard" class="card" style="display: none;">
            <h2>Resultados del Cálculo Numérico</h2>
            
            <div class="summary-box">
                <p><strong>Volumen Estimado:</strong> <span id="volResult">0</span> mL (cm³)</p>
                <p><strong>Puntos Evaluados:</strong> <span id="pointsCount">0</span></p>
                <p id="secanteResult" class="highlight-text"></p>
            </div>

            <h3>Dataset Extraído (z_i, r_i)</h3>
            <table id="datasetTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Altura z_i (cm)</th>
                        <th>Radio r_i (cm)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
